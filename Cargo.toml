[package]
name = "featherlauncher"
version = "0.1.7"
description = "Instala, atualiza e abre os aplicativos da suíte FeatherWorks"
authors = ["FeatherWorks"]
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/feather-works/featherlauncher"
publish = false

[dependencies]
pelicano = { git = "https://github.com/feather-works/pelicano", tag = "v0.1.8" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
# A foto de fundo; a mesma versão que o pelicano usa.
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
# O ícone embutido no .exe do Windows (build.rs).
embed-resource = "3"

[target.'cfg(target_os = "linux")'.dependencies]
# O ícone na bandeja (StatusNotifierItem pelo D-Bus: KDE e a extensão AppIndicator do GNOME), sem GTK.
ksni = "0.3"

[target.'cfg(windows)'.dependencies]
# RAM e CPU do launcher no rodapé.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[profile.release]
lto = "thin"
strip = true
